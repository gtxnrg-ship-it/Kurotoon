name: Android APK

on:
  pull_request:
    paths:
      - 'apps/kurotoon_flutter/**'
      - 'packages/kurotoon_core/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build native Flutter Kurotoon APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create \
            --platforms=android \
            --project-name kurotoon_flutter \
            --org com.kurotoon \
            /tmp/kurotoon_flutter_scaffold
          cp -R /tmp/kurotoon_flutter_scaffold/android apps/kurotoon_flutter/android

      - name: Resolve Flutter dependencies
        working-directory: apps/kurotoon_flutter
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: apps/kurotoon_flutter
        run: flutter analyze

      - name: Test Flutter application and storage
        working-directory: apps/kurotoon_flutter
        run: flutter test

      - name: Build release APK
        working-directory: apps/kurotoon_flutter
        run: flutter build apk --release

      - name: Name APK and create checksum
        run: |
          mkdir -p release
          cp apps/kurotoon_flutter/build/app/outputs/flutter-apk/app-release.apk release/Kurotoon.apk
          sha256sum release/Kurotoon.apk > release/Kurotoon.apk.sha256

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kurotoon-Flutter-APK
          path: |
            release/Kurotoon.apk
            release/Kurotoon.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish continuous APK release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-${{ github.run_number }}
          name: Kurotoon Flutter development build
          prerelease: true
          make_latest: false
          files: |
            release/Kurotoon.apk
            release/Kurotoon.apk.sha256
          body: |
            Native Flutter/Dart Kurotoon Android development build.
            File: Kurotoon.apk
            SHA-256 checksum: Kurotoon.apk.sha256
            Commit: ${{ github.sha }}

      # Stable URL for the README and in-app/update surfaces. Historical
      # continuous-N releases remain available, while this tag tracks the last
      # successful main-branch build.
      - name: Publish stable latest APK download
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<EOF
          Latest successful native Flutter/Dart Kurotoon Android development build.
          Built from commit: $GITHUB_SHA
          Artifact: Kurotoon.apk
          Checksum: Kurotoon.apk.sha256
          This is a development build, not a store release; validate on device before relying on it.
          EOF
          git tag -f continuous-latest "$GITHUB_SHA"
          git push --force origin refs/tags/continuous-latest
          if gh release view continuous-latest >/dev/null 2>&1; then
            gh release upload continuous-latest release/Kurotoon.apk release/Kurotoon.apk.sha256 --clobber
            gh release edit continuous-latest \
              --title "Kurotoon latest Flutter development build" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create continuous-latest release/Kurotoon.apk release/Kurotoon.apk.sha256 \
              --title "Kurotoon latest Flutter development build" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Publish versioned APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kurotoon
          prerelease: false
          files: |
            release/Kurotoon.apk
            release/Kurotoon.apk.sha256
          body: |
            Native Flutter/Dart Kurotoon Android release.
            File: Kurotoon.apk
            SHA-256 checksum: Kurotoon.apk.sha256
            Commit: ${{ github.sha }}
