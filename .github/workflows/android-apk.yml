name: Android APK

on:
  pull_request:
    paths:
      - 'apps/kurotoon_flutter/**'
      - 'packages/kurotoon_core/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build native Flutter Kurotoon APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create \
            --platforms=android \
            --project-name kurotoon_flutter \
            --org com.kurotoon \
            /tmp/kurotoon_flutter_scaffold
          cp -R /tmp/kurotoon_flutter_scaffold/android apps/kurotoon_flutter/android

      - name: Resolve Flutter dependencies
        working-directory: apps/kurotoon_flutter
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: apps/kurotoon_flutter
        run: flutter analyze

      - name: Test Flutter application and storage
        working-directory: apps/kurotoon_flutter
        run: flutter test

      - name: Build release APK
        working-directory: apps/kurotoon_flutter
        run: flutter build apk --release

      - name: Name the APK Kurotoon.apk
        run: |
          mkdir -p release
          cp apps/kurotoon_flutter/build/app/outputs/flutter-apk/app-release.apk release/Kurotoon.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kurotoon-Flutter-APK
          path: release/Kurotoon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish continuous APK release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-\${{ github.run_number }}
          name: Kurotoon Flutter development build
          prerelease: true
          make_latest: false
          files: release/Kurotoon.apk
          body: |
            Native Flutter/Dart Kurotoon Android development build.
            File: Kurotoon.apk
            Commit: \${{ github.sha }}

      - name: Publish versioned APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ github.ref_name }}
          name: Kurotoon
          prerelease: false
          files: release/Kurotoon.apk
          body: |
            Native Flutter/Dart Kurotoon Android release.
            File: Kurotoon.apk
            Commit: \${{ github.sha }}
